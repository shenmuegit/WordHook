<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>WordHook 配置</title>
  <link rel="stylesheet" href="./config.css">
</head>
<body>
  <main>
    <h1>WordHook 配置</h1>
    <label>Base URL<input id="baseURL" placeholder="https://api.openai.com/v1"></label>
    <label>Model<input id="model" placeholder="gpt-4o-mini"></label>
    <label>API Key<input id="apiKey" type="password" placeholder="sk-..."></label>
    <label>翻译快捷键<input id="hotkey" readonly placeholder="点击后按下组合键"></label>
    <label class="check"><input id="hotkeyEnabled" type="checkbox"> 启用翻译快捷键</label>
    <label>隐藏快捷键<input id="hideHotkey" readonly placeholder="点击后按下组合键"></label>
    <label class="check"><input id="hideHotkeyEnabled" type="checkbox"> 启用隐藏快捷键</label>
    <button id="save">保存</button>
    <p id="status"></p>
  </main>
  <script src="./config.js"></script>
</body>
</html>
